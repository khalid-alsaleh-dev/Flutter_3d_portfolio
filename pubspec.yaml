name: flutter_3d_portfolio
description: Khalid Al-Saleh's ninja-themed 3D portfolio, built with Flutter for the web.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  model_viewer_plus: ^1.10.0
  flutter_animate: ^4.5.2
  flame: ^1.38.2
  flame_audio: ^2.12.2
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.3
  vector_math: any
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/three_d_models/planet/
    - assets/three_d_models/planet/textures/
    - assets/images/
    - assets/images/sprites/
    - assets/images/previews/
    - assets/audio/

  fonts:
    - family: Ebrima
      fonts:
        - asset: assets/fonts/ebrima.ttf
        - asset: assets/fonts/ebrima-bold.ttf
          weight: 700
