<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    If you serve the app from a sub-path, pass `flutter build web --base-href /path/`
    and add back: <base href="$FLUTTER_BASE_HREF">
  -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khalid Al-Saleh: Dubai-based Senior Flutter Engineer with 5+ years building production mobile apps and the backend systems behind them.">
  <meta name="theme-color" content="#0b0d13">

  <meta property="og:title" content="Khalid Al-Saleh · Shinobi of Code">
  <meta property="og:description" content="Senior Flutter Engineer in Dubai. Scroll to unsheathe.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Khalid Al-Saleh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="devboxer_logo.png" />

  <title>Khalid Al-Saleh · Shinobi of Code</title>
  <link rel="manifest" href="manifest.json">

  <script type="module" src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>

  <style>
    /* :root, not `html`: model_viewer_plus embeds its own <html> element.
       The sky and vignette live here rather than in Flutter: the browser
       composites a CSS background for free, while Flutter would re-rasterize
       two full-screen gradients every frame. Dart updates --sky-top and
       --sky-bottom as you scroll (lib/effects/css_backdrop.dart). */
    :root {
      --sky-top: #070912;
      --sky-bottom: #10141f;
    }

    :root, :root > body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    :root > body {
      background:
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(var(--sky-top), var(--sky-bottom));
      background-color: #0b0d13;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: system-ui, sans-serif;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    #loader.done { opacity: 0; pointer-events: none; }

    .shuriken {
      width: 96px;
      height: 96px;
      animation: spin 0.7s linear infinite;
      filter: drop-shadow(0 0 18px rgba(106, 233, 159, 0.55));
    }

    .slash {
      width: 220px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6AE99F, #fff, transparent);
      background-size: 200% 100%;
      animation: slash 1.1s ease-in-out infinite;
    }

    .label {
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 6px;
      font-size: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slash {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <svg class="shuriken" viewBox="-50 -50 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4f8fb" />
          <stop offset="0.5" stop-color="#8c96a0" />
          <stop offset="1" stop-color="#3a4148" />
        </linearGradient>
      </defs>
      <path fill="url(#steel)"
        d="M0,-48 L9,-9 L48,0 L9,9 L0,48 L-9,9 L-48,0 L-9,-9 Z" />
      <circle r="7" fill="#0b0d13" stroke="#6AE99F" stroke-width="2" />
    </svg>
    <div class="slash"></div>
    <div class="label">SHARPENING BLADES</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 700);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
